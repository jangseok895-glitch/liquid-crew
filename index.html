<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8인 점수판</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#10131d;color:#fff;padding:32px 18px}
main{max-width:1420px;margin:0 auto}
h1{text-align:center;margin:0 0 26px;font-size:clamp(25px,4vw,38px)}
.score-row{display:grid;grid-template-columns:repeat(8,minmax(125px,1fr));gap:12px;overflow-x:auto;padding:3px 2px 15px}
.card{min-width:125px;min-height:220px;border-radius:18px;padding:17px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-shadow:0 8px 22px #0005;border:1px solid #ffffff55}
.card h2{font-size:31px;font-weight:900;color:#fff;line-height:1.2;margin:0;overflow-wrap:anywhere}
.score{margin-top:12px;font-variant-numeric:tabular-nums;font-size:54px;line-height:1;font-weight:900}
.controls{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.controls button{width:52px;height:44px;border:0;border-radius:12px;background:#111827;color:white;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px #0005}
.controls button:hover{filter:brightness(1.25)}
.controls button:active{transform:translateY(1px)}
.edit-section{margin-top:20px;padding:20px;border-radius:18px;background:#1b2030;border:1px solid #ffffff20}
.edit-section h2{margin:0 0 14px;font-size:20px}
.edit-row{display:grid;grid-template-columns:repeat(8,minmax(115px,1fr));gap:10px;overflow-x:auto;padding-bottom:2px}
.edit-item{min-width:115px}
.edit-item label{display:block;margin:0 0 6px;font-size:13px;color:#c6cede}
.edit-item input{width:100%;padding:10px 9px;border-radius:9px;border:1px solid #46506a;background:#101522;color:white;font-size:14px}
.hint{text-align:center;color:#aab2c5;font-size:13px;margin:14px 0 0}
@media(max-width:900px){.score-row{grid-template-columns:repeat(8,minmax(135px,1fr))}.edit-row{grid-template-columns:repeat(8,minmax(135px,1fr))}}
</style>
</head>
<body>
<main>
  <h1>8인 점수판</h1>
  <section class="score-row" id="scoreRow" aria-label="아이디별 점수"></section>
  <section class="edit-section">
    <h2>아이디 변경</h2>
    <div class="edit-row" id="editRow"></div>
    <p class="hint">아이디를 입력하면 점수판에 바로 반영됩니다.</p>
  </section>
</main>
<script>
const COLORS=["#e85d75","#e99b34","#3b9d77","#3984d6","#8657c8","#d254ad","#31a6aa","#737f91"];
const KEY="simple-eight-scoreboard-v1";
let players;
try{players=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!Array.isArray(players)||players.length!==8){
  players=Array.from({length:8},(_,i)=>({name:`아이디 ${i+1}`,score:3}));
}
players=players.map((p,i)=>({name:String(p?.name||`아이디 ${i+1}`),score:Number.isFinite(Number(p?.score))?Number(p.score):3}));
function save(){localStorage.setItem(KEY,JSON.stringify(players))}
function render(){
  document.getElementById("scoreRow").innerHTML=players.map((p,i)=>`
    <article class="card" style="background:${COLORS[i]}" aria-label="${escapeHtml(p.name)} 점수 ${p.score}점">
      <h2>${escapeHtml(p.name)}</h2>
      <div class="score">${p.score}</div>
      <div class="controls">
        <button type="button" aria-label="${escapeHtml(p.name)} 점수 올리기" title="1점 올리기" onclick="changeScore(${i},1)">↑</button>
        <button type="button" aria-label="${escapeHtml(p.name)} 점수 내리기" title="1점 내리기" onclick="changeScore(${i},-1)">↓</button>
      </div>
    </article>`).join("");
  document.getElementById("editRow").innerHTML=players.map((p,i)=>`
    <div class="edit-item"><label for="player-${i}">${i+1}번 아이디</label>
    <input id="player-${i}" value="${escapeAttr(p.name)}" aria-label="${i+1}번 아이디 변경" oninput="changeName(${i},this.value)"></div>`).join("");
}
function changeScore(i,delta){players[i].score+=delta;save();render()}
function changeName(i,name){players[i].name=name.trim()||`아이디 ${i+1}`;save();const title=document.querySelectorAll(".card h2")[i];if(title)title.textContent=players[i].name}
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function escapeAttr(value){return escapeHtml(value)}
render();
</script>
</body>
</html>
